name: Dev - Backend + PDF + Orchestrator
 
on:
  #workflow_dispatch:
  push:
    branches: [ main ]
    paths: 
      - 'Backend/**'
      - 'PDF-Processing/**'
      - 'Orchestrator/**'
jobs:
  build:
    name: Triggering DEV 
    runs-on: ubuntu-latest
    env:
      APP_ENV: DEV
    #if: github.event.pull_request.merged == true
    steps:
      - uses: dorny/paths-filter@v2
        id: changes
        with:
           filters: |
              Backend:
                - 'backend/**'
              PDF-Processing:
                - 'PDF-Processing/**'
              Orchestrator:
                - 'Orchestrator/**'
      #- name: Trigger Dev backend
        # run only if some file in 'backend' folder was changed
        if: steps.changes.outputs.Backend == 'true'
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Free disk space
        run: |
          echo "Before cleanup"
          df -h
          # Remove large unused packages
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/lib/jvm
          # Clean Docker
          docker system prune -af || true
          echo "After cleanup"
          df -h
      - name: test dev backend
        run: |
          echo "Tetsing BAckend DEV"
        # run only if some file not 'PDF-Processing' folder was changed
      #- name: Trigger Build-Portal PDF-Processing
        if: steps.changes.outputs.PDF-Processing == 'true'
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: test dev PDF Processing
        run: |
          echo "Tetsing  Processing DEV"
        # run only if some file not 'Orchestrator' folder was changed
      #- name: Trigger Dev Orchestrator
        if: steps.changes.outputs.Orchestrator == 'true'
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test Orchestrator Dev
        run: |
         echo "Testing Orchestrator Dev"
